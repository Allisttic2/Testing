<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopIT – IT-utrustning mellan NTI-skolor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap">
<style>
:root{--bg:#EAF1FD;--ink:#0A2A6B;--card:#fff;--line:#C6D6F5;--mut:#3B5486;--ph:#CFE0FA;--brand:#1448C8;--acc:#1D5BFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1A40;--ink:#E6EEFF;--card:#12285C;--line:#24407F;--mut:#B9CCF5;--ph:#1B3A7A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1A40;--ink:#E6EEFF;--card:#12285C;--line:#24407F;--mut:#B9CCF5;--ph:#1B3A7A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'DM Sans',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
h1,h2,h3,.lg{font-family:Sora,'DM Sans',system-ui,sans-serif;margin:0;line-height:1.2}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
a{color:inherit}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--brand);color:#fff}
.hw{display:flex;align-items:center;gap:16px;padding:10px 20px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.brand img{height:30px;width:auto;background:#fff;border-radius:8px;padding:5px 9px}
.brand .lg{font-size:20px;font-weight:700;color:#fff}
.nv{display:flex;gap:4px;flex:1}
.nv a{color:#fff;text-decoration:none;min-height:44px;display:flex;align-items:center;padding:0 14px;border-radius:10px;font-size:15px}
.nv a[aria-current]{background:rgba(255,255,255,.2);font-weight:700}
.cartb{margin-left:auto;background:#fff;color:var(--brand);border:0;border-radius:10px;min-height:44px;padding:0 14px;font:700 15px 'DM Sans',sans-serif;cursor:pointer}
.bd{background:var(--brand);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px;font-size:13px}
.cp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:12px;width:min(380px,calc(100vw - 24px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(20,72,200,.25);padding:16px;display:flex;flex-direction:column;gap:12px;z-index:26;max-height:70vh;overflow:auto}
.cp[hidden]{display:none}
main{max-width:1280px;margin:0 auto;padding:24px 20px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
.b{min-height:44px;padding:0 18px;border-radius:10px;border:2px solid var(--mut);background:var(--card);color:var(--ink);font:700 15px 'DM Sans',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.b.p{background:var(--acc);border-color:var(--acc);color:#fff}
.b[disabled]{opacity:.5;cursor:not-allowed}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--mut);background:var(--card);color:var(--ink);font:500 14px 'DM Sans',sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
input[type=text],input[type=password],input[type=number],input[type=email],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--mut);background:var(--card);color:var(--ink);font:400 16px 'DM Sans',sans-serif}
textarea{min-height:110px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mut)}
label.ck{display:flex;gap:10px;align-items:center;min-height:44px}
label.ck input{width:20px;height:20px}
.lay{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.flt{display:flex;flex-direction:column;gap:6px}
.flt summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.fb{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pc{display:flex;flex-direction:column;gap:6px;text-decoration:none;padding:12px}
.pc img,.hero{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--ph)}
.pd{display:grid;grid-template-columns:1.2fr 1fr;gap:32px}
.th{display:flex;gap:8px;margin-top:10px}.th img{width:72px;height:54px;object-fit:cover;border-radius:8px;cursor:pointer}
.col{display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.li{display:flex;gap:12px;align-items:center}
.li img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.li>div{flex:1;min-width:0}
.inv{background:#fff;color:#0A2A6B;border:1px solid #C6D6F5;border-radius:10px;padding:24px}
.inv table{width:100%;border-collapse:collapse;margin:16px 0}.inv th,.inv td{text-align:left;padding:8px 6px;border-bottom:1px solid #C6D6F5}.inv .r{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:40;font-size:15px}
.login{max-width:420px;margin:48px auto}
.ok{color:#0A7A3B}
@media (max-width:899px){.lay,.pd{grid-template-columns:1fr}}
@media (max-width:699px){
.hw{padding:10px 14px}.brand img{height:24px}.brand .lg{font-size:17px}
.nv{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:25}
.nv a{color:var(--mut);flex:1;justify-content:center;font-size:13px;font-weight:700}
.nv a[aria-current]{background:none;color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
:root[data-theme="dark"] .nv a[aria-current]{color:#7FA6FF;box-shadow:inset 0 3px 0 #7FA6FF}
main{padding-bottom:96px}
}
@media print{.hd,.nv,.noprint,.toast{display:none!important}body{background:#fff}}
@media (prefers-reduced-motion:no-preference){.cp{animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(-6px)}}}
</style>
</head>

function cartH(){const ls=clines();if(!ls.length)return `<p class="mut" style="margin:0">${t('empty')}</p>`;
return ls.map(x=>`<div class="li"><img src="${img(x.l)}" alt=""><div><b>${esc(x.l.title)}</b><div class="mut">${kr(x.l.price)} · ${t('qty')} ${x.q}</div></div><button class="chip" data-a="rm" data-id="${x.l.id}" aria-label="${t('rm')} ${esc(x.l.title)}">${t('rm')}</button></div>`).join('')+`<div class="row sp"><b>${t('total')}</b><b>${kr(ls.reduce((a,x)=>a+x.l.price*x.q,0))}</b></div><a class="b p" href="#/checkout" data-a="closecart">${t('pay')}</a>`}
function loginV(){return `<main><form id="login" class="card login col"><img src="${LOGO}" alt="NTI Gymnasiet" style="height:34px;width:auto;align-self:flex-start"><h1>ShopIT</h1><p class="mut" style="margin:0">${t('lock')}</p><label class="f">${t('usr')}<input type="text" name="u" required autocomplete="username"></label><label class="f">${t('pw')}<input type="password" name="p" autocomplete="current-password"></label><label class="f">${t('loc')}<select name="s">${SCH.map(s=>`<option>${s}</option>`).join('')}</select></label><button class="b p" type="submit">${t('login')}</button><p class="mut" style="margin:0">${t('lnote')}</p><div class="row"><button type="button" class="chip" data-a="lang" data-v="sv" aria-pressed="${S.lang==='sv'}">Svenska</button><button type="button" class="chip" data-a="lang" data-v="en" aria-pressed="${S.lang==='en'}">English</button></div></form></main>`}
function live(){return S.listings.filter(l=>l.created+30*D>Date.now()&&l.qty>0)}
function gridH(){const q=F.q.trim().toLowerCase();let a=live().filter(l=>(!F.cats.length||F.cats.includes(l.cat))&&(!F.sch||l.school===F.sch)&&(!q||(l.title+' '+l.desc+' '+l.school).toLowerCase().includes(q)));
const s={new:(x,y)=>y.created-x.created,old:(x,y)=>x.created-y.created,plo:(x,y)=>x.price-y.price,phi:(x,y)=>y.price-x.price}[F.sort];a.sort(s);
GN=a.length;return a.length?a.map(l=>`<a class="card pc" href="#/p/${l.id}"><img src="${img(l)}" alt="" loading="lazy"><h3>${esc(l.title)}</h3><span class="mut">${esc(l.school)} · ${dl(l)} ${t('left')}</span><span class="row sp"><b>${kr(l.price)}</b><span class="mut">${t('qty')} ${l.qty}</span></span></a>`).join(''):`<p class="mut">${t('nores')}</p>`}
let GN=0;
function homeV(){const g=gridH(),open=matchMedia('(min-width:900px)').matches?'open':'';
return `<div class="lay"><details class="card flt" ${open}><summary>${t('flt')}</summary><div class="fb"><input type="text" id="q" value="${esc(F.q)}" placeholder="${t('q')}" aria-label="${t('q')}"><b>${t('cat')}</b>${Object.keys(CATS).map(c=>`<label class="ck"><input type="checkbox" data-fc="${c}" ${F.cats.includes(c)?'checked':''}>${cname(c)}</label>`).join('')}<label class="f">${t('sort')}<select id="sort">${[['new','new'],['old','old'],['plo','plo'],['phi','phi']].map(([v,k])=>`<option value="${v}" ${F.sort===v?'selected':''}>${t(k)}</option>`).join('')}</select></label><label class="f">${t('loc')}<select id="sch"><option value="">${t('all')}</option>${SCH.map(s=>`<option ${F.sch===s?'selected':''}>${s}</option>`).join('')}</select></label><button class="b" data-a="clr">${t('clr')}</button></div></details><section><p class="mut" id="cnt" aria-live="polite">${GN} ${t('res')}</p><div class="grid" id="grid">${g}</div></section></div>`}
function prodV(id){const l=find(id);if(!l)return `<p>${t('nores')}</p><a class="b" href="#/">${t('back')}</a>`;const own=l.school===me();
return `<a href="#/" class="mut">← ${t('back')}</a><div class="pd" style="margin-top:12px"><div><img class="hero" id="hero" src="${img(l)}" alt="${esc(l.title)}">${l.imgs.length>1?`<div class="th">${l.imgs.map((s,i)=>`<img src="${s}" alt="" data-a="thumb" data-i="${i}">`).join('')}</div>`:''}</div><div class="col"><span class="mut">${cname(l.cat)}</span><h1>${esc(l.title)}</h1><div class="lg" style="font-size:28px;font-weight:700">${kr(l.price)}</div><div class="mut">${esc(l.school)} · ${l.qty} ${t('stock')} · ${dl(l)} ${t('left')}</div><p style="margin:0;white-space:pre-line">${esc(l.desc)}</p>${own?`<p class="mut">${t('own')}</p><a class="b" href="#/ad/${l.id}">${t('edit')}</a>`:`<label class="f" style="max-width:140px">${t('qty')}<input type="number" id="pq" min="1" max="${l.qty}" value="1"></label><button class="b" data-a="add" data-id="${l.id}">${t('add')}</button><button class="b p" data-a="buy" data-id="${l.id}">${t('buy')}</button><p class="mut" style="margin:0">${t('pf')}</p>`}</div></div>`}
function bill(){const s=sch(me());return !!(s.address.trim()&&s.bill.trim())}
function checkV(){const ls=clines();if(!ls.length)return `<h1>${t('cart')}</h1><p>${t('empty')}</p><a class="b" href="#/">${t('home')}</a>`;
return `<h1>${t('pay')}</h1><div class="card col" style="margin-top:16px;max-width:640px">${ls.map(x=>`<div class="row sp"><span>${esc(x.l.title)} × ${x.q}</span><b>${kr(x.l.price*x.q)}</b></div>`).join('')}<div class="row sp"><b>${t('total')}</b><b>${kr(ls.reduce((a,x)=>a+x.l.price*x.q,0))}</b></div><b>${t('pm')}</b><label class="ck"><input type="radio" checked disabled> ${t('pf')}</label>${bill()?'':`<p class="mut" style="margin:0">${t('nolow')} <a href="#/me/info">${t('my')}</a></p>`}<button class="b p" data-a="confirm" ${bill()?'':'disabled'}>${t('pay')}</button></div>`}
function place(lines){const ls=lines.filter(x=>x.l&&x.l.school!==me()&&x.q>0&&x.q<=x.l.qty);if(!ls.length){toast(t('empty'));return null}
const o={no:'SH-'+(++S.seq),date:Date.now(),buyer:me(),by:S.user.name,lines:ls.map(x=>({t:x.l.title,p:x.l.price,q:x.q,s:x.l.school})),total:ls.reduce((a,x)=>a+x.l.price*x.q,0)};
ls.forEach(x=>{x.l.qty-=x.q});S.listings=S.listings.filter(l=>l.qty>0);const ids=ls.map(x=>x.l.id);S.cart=S.cart.filter(c=>!ids.includes(c.id));S.orders.unshift(o);save();return o}
function orderV(no){const o=S.orders.find(x=>x.no===no);if(!o)return `<p>${t('noord')}</p>`;const b=sch(o.buyer),ss=[...new Set(o.lines.map(l=>l.s))];
return `<p class="ok noprint" style="font-weight:700">${t('done')}</p><div class="inv"><div class="row sp"><img src="${LOGO}" alt="NTI Gymnasiet" style="height:34px;width:auto"><h2>${t('invc')} ${o.no}</h2></div><div class="row sp" style="align-items:flex-start;margin-top:16px"><div><b>${t('seller')}</b><br>${ss.map(s=>`${esc(s)}${sch(s).address?'<br>'+esc(sch(s).address):''}`).join('<br>')}</div><div><b>${t('buyer')}</b><br>${esc(o.buyer)}<br>${esc(b.address)}<br>${esc(b.bill)}</div><div>${t('date')}: ${dfmt(o.date)}<br>${t('due')}: ${dfmt(o.date+30*D)}</div></div><div style="overflow-x:auto"><table><thead><tr><th>${t('prod')}</th><th>${t('qty')}</th><th class="r">${t('price')}</th></tr></thead><tbody>${o.lines.map(l=>`<tr><td>${esc(l.t)}<br><small>${esc(l.s)}</small></td><td>${l.q}</td><td class="r">${kr(l.p*l.q)}</td></tr>`).join('')}</tbody><tfoot><tr><th colspan="2">${t('total')}</th><th class="r">${kr(o.total)}</th></tr></tfoot></table></div><small>${t('invn')}</small></div><div class="row noprint" style="margin-top:16px"><button class="b p" data-a="print">${t('print')}</button><a class="b" href="#/">${t('home')}</a></div>`}
function meV(tab){const tabs=[['info','info'],['ads','ads'],['inv','inv'],['orders','orders']].map(([k,l])=>`<a class="chip" style="display:inline-flex;align-items:center;text-decoration:none" href="#/me/${k}" aria-pressed="${tab===k}">${t(l)}</a>`).join('');let c='';const s=sch(me());
if(tab==='info')c=`<form id="school" class="card col" style="max-width:560px"><h2>${esc(me())}</h2><label class="f">${t('addr')}<input type="text" name="a" value="${esc(s.address)}"></label><label class="f">${t('bill')}<textarea name="b">${esc(s.bill)}</textarea></label><label class="f">${t('mail')}<input type="email" name="m" value="${esc(s.mail)}"></label><button class="b p" type="submit">${t('save')}</button></form>`;
else if(tab==='ads'){const a=S.listings.filter(l=>l.school===me());c=`<div class="row sp" style="margin-bottom:12px"><h2>${t('ads')}</h2><a class="b p" href="#/ad/new" data-a="newad">+ ${t('newad')}</a></div><div class="col">${a.length?a.map(l=>`<div class="card li"><img src="${img(l)}" alt=""><div><b>${esc(l.title)}</b><div class="mut">${kr(l.price)} · ${t('qty')} ${l.qty} · ${dl(l)} ${t('left')}</div></div><a class="b" href="#/ad/${l.id}">${t('edit')}</a><button class="b" data-a="del" data-id="${l.id}">${t('del')}</button></div>`).join(''):`<p class="mut">${t('noads')}</p>`}</div>`}
else if(tab==='inv'){const iv=S.inv[me()]||[];c=`<h2 style="margin-bottom:12px">${t('inv')}</h2><div class="col">${iv.map(i=>`<div class="card row sp"><span><b>${esc(i.n)}</b> × ${i.q}</span><span class="row"><button class="b" data-a="mk" data-id="${i.id}">${t('mk')}</button><button class="b" data-a="ivdel" data-id="${i.id}">${t('del2')}</button></span></div>`).join('')}<form id="invf" class="card row" style="align-items:flex-end"><label class="f" style="flex:2;min-width:160px">${t('item')}<input type="text" name="n" required></label><label class="f" style="flex:1;min-width:90px">${t('qty')}<input type="number" name="q" min="1" value="1" required></label><button class="b p" type="submit">+ ${t('save')}</button></form></div>`}
else{c=`<h2 style="margin-bottom:12px">${t('orders')}</h2><div class="col">${S.orders.filter(o=>o.buyer===me()).map(o=>`<a class="card row sp" style="text-decoration:none" href="#/order/${o.no}"><b>${o.no}</b><span>${dfmt(o.date)}</span><b>${kr(o.total)}</b></a>`).join('')||`<p class="mut">${t('noord')}</p>`}</div>`}
return `<h1>${t('my')}</h1><div class="tabs">${tabs}</div>${c}`}
function adV(id){if(!DR||DR.key!==id){const l=find(id);if(id!=='new'&&(!l||l.school!==me()))return `<p>${t('nores')}</p>`;DR=id==='new'?{key:'new',title:'',cat:'Datorer',price:'',qty:1,desc:'',imgs:[]}:{key:id,title:l.title,cat:l.cat,price:l.price,qty:l.qty,desc:l.desc,imgs:[...l.imgs]}}
const d=DR;return `<h1>${t(id==='new'?'newad':'edit')}</h1><form id="ad" class="card col" style="max-width:600px;margin-top:16px"><div class="row">${d.imgs.map((s,i)=>`<span style="position:relative"><img src="${s}" alt="" style="width:92px;height:70px;object-fit:cover;border-radius:8px"><button type="button" class="chip" style="position:absolute;top:2px;right:2px;min-height:32px;padding:0 8px" data-a="imgdel" data-i="${i}" aria-label="${t('rm')}">×</button></span>`).join('')||`<div class="mut">${t('noimg')}</div>`}</div><div class="row"><label class="b" style="cursor:pointer">${t('up')}<input id="f1" type="file" accept="image/*" hidden></label><label class="b" style="cursor:pointer">${t('cam')}<input id="f2" type="file" accept="image/*" capture="environment" hidden></label></div><label class="f">${t('title')}<input type="text" data-d="title" name="t" value="${esc(d.title)}" required></label><label class="f">${t('cat')}<select data-d="cat" name="c">${Object.keys(CATS).map(c=>`<option value="${c}" ${d.cat===c?'selected':''}>${cname(c)}</option>`).join('')}</select></label><div class="row"><label class="f" style="flex:1;min-width:120px">${t('price')}<input type="number" min="0" data-d="price" name="p" value="${esc(d.price)}" required></label><label class="f" style="flex:1;min-width:120px">${t('qty')}<input type="number" min="1" data-d="qty" name="q" value="${esc(d.qty)}" required></label></div><label class="f">${t('desc')}<textarea data-d="desc" name="d">${esc(d.desc)}</textarea></label><p class="mut" style="margin:0">${t('pshow')}</p><div class="row"><button class="b p" type="submit">${t('pub')}</button><a class="b" href="#/me/ads" data-a="cancel">${t('cancel')}</a></div></form>`}
function setV(){const b=(a,v,l,on)=>`<button class="chip" data-a="${a}" data-v="${v}" aria-pressed="${on}">${l}</button>`;
return `<h1>${t('set')}</h1><div class="card col" style="max-width:560px;margin-top:16px"><p class="mut" style="margin:0">${t('user')} <b>${esc(S.user.name)}</b> · ${esc(me())}</p><a class="b" style="align-self:flex-start" href="#/me/info">${t('goto')}</a><div class="row"><b>${t('lang')}</b>${b('lang','sv','Svenska',S.lang==='sv')}${b('lang','en','English',S.lang==='en')}</div><div class="row"><b>${t('look')}</b>${b('theme','','${t'+"('auto')}".replace('${t(\'auto\')}','')+t('auto'),!S.theme)}${b('theme','light',t('light'),S.theme==='light')}${b('theme','dark',t('dark'),S.theme==='dark')}</div><button class="b" style="align-self:flex-start" data-a="logout">${t('logout')}</button></div>`}
function render(){S.listings=S.listings.filter(l=>l.created+30*D>Date.now());theme();const h=location.hash.slice(1)||'/',p=h.split('/').filter(Boolean),r=p[0]||'',A=$('#app');
if(!S.user){if(h!=='/login'){location.hash='/login';return}A.innerHTML=loginV();return}
if(h==='/login'){location.hash='/';return}
const v={'':()=>homeV(),p:()=>prodV(p[1]),checkout:()=>checkV(),order:()=>orderV(p[1]),me:()=>meV(p[1]||'ads'),ad:()=>adV(p[1]),settings:()=>setV()}[r]||(()=>homeV());
if(r!=='ad')DR=null;A.innerHTML=head(r)+`<main>${v()}</main>`}
function rerender(){const y=scrollY;render();scrollTo(0,y)}
const upd=()=>{const g=$('#grid');if(g){g.innerHTML=gridH();$('#cnt').textContent=GN+' '+t('res')}};
function readImg(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};im.src=fr.result};fr.readAsDataURL(f)})}
const ACT={
cart(){const p=$('#cp'),o=p.hidden;p.hidden=!o;if(o)p.innerHTML=cartH();$('.cartb').setAttribute('aria-expanded',o)},
closecart(){$('#cp').hidden=true},
rm(d){S.cart=S.cart.filter(c=>c.id!==d.id);save();const o=!$('#cp').hidden;rerender();if(o){$('#cp').hidden=false;$('#cp').innerHTML=cartH()}},
add(d){const l=find(d.id),q=Math.max(1,parseInt($('#pq').value)||1),c=S.cart.find(x=>x.id===d.id);const n=Math.min(l.qty,(c?c.q:0)+q);c?c.q=n:S.cart.push({id:d.id,q:n});save();toast(t('added'));rerender()},
buy(d){const l=find(d.id),q=Math.max(1,parseInt($('#pq').value)||1);const o=place([{l,q:Math.min(q,l.qty)}]);if(o)location.hash='/order/'+o.no},
confirm(){const o=place(clines());if(o)location.hash='/order/'+o.no},
clr(){F.q='';F.cats=[];F.sort='new';F.sch='';rerender()},
thumb(d){const l=find(location.hash.split('/')[2]);$('#hero').src=l.imgs[d.i]},
lang(d){S.lang=d.v;save();rerender()},
theme(d){S.theme=d.v||null;save();rerender()},
logout(){S.user=null;S.cart=[];save();location.hash='/login';render()},
del(d){if(confirm(t('sure'))){S.listings=S.listings.filter(l=>l.id!==d.id);save();rerender()}},
newad(){DR=null},cancel(){DR=null},
mk(d){const i=(S.inv[me()]||[]).find(x=>x.id===d.id);DR={key:'new',title:i.n,cat:'Datorer',price:'',qty:i.q,desc:'',imgs:[]};location.hash='/ad/new'},
ivdel(d){S.inv[me()]=S.inv[me()].filter(x=>x.id!==d.id);save();rerender()},
imgdel(d){DR.imgs.splice(+d.i,1);rerender()},
print(){print()}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');const cp=$('#cp');if(cp&&!cp.hidden&&!e.target.closest('#cp')&&!e.target.closest('.cartb'))cp.hidden=true;if(a&&ACT[a.dataset.a])ACT[a.dataset.a](a.dataset)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#cp'))$('#cp').hidden=true});
document.addEventListener('input',e=>{const x=e.target;if(x.id==='q'){F.q=x.value;upd()}else if(x.dataset.d&&DR)DR[x.dataset.d]=x.value});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset.fc!==undefined){F.cats=[...document.querySelectorAll('[data-fc]:checked')].map(i=>i.dataset.fc);upd()}else if(x.id==='sort'){F.sort=x.value;upd()}else if(x.id==='sch'){F.sch=x.value;upd()}else if((x.id==='f1'||x.id==='f2')&&x.files[0]&&DR){if(DR.imgs.length>=3){toast(t('noimg'));return}readImg(x.files[0]).then(s=>{DR.imgs.push(s);rerender()})}});
const FORMS={
login(f){const u=f.get('u').trim();if(!u)return;S.user={name:u,school:f.get('s')};save();location.hash='/';render()},
school(f){const s=sch(me());s.address=f.get('a');s.bill=f.get('b');s.mail=f.get('m');save();toast(t('saved'))},
invf(f){const a=S.inv[me()]||(S.inv[me()]=[]);a.push({id:'i'+Date.now(),n:f.get('n').trim(),q:Math.max(1,parseInt(f.get('q'))||1)});save();rerender()},
ad(){const d=DR,p=Number(d.price),q=parseInt(d.qty);if(!d.title.trim()||!(p>=0)||!(q>=1)){toast(t('fail'));return}
if(d.key==='new')S.listings.unshift({id:'l'+Date.now(),title:d.title.trim(),cat:d.cat,price:p,qty:q,school:me(),desc:d.desc,imgs:d.imgs,created:Date.now()});
else Object.assign(find(d.key),{title:d.title.trim(),cat:d.cat,price:p,qty:q,desc:d.desc,imgs:d.imgs});
DR=null;save();toast(t('saved'));location.hash='/me/ads'}};
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(FORMS[f.id])FORMS[f.id](new FormData(f))});
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
render();
})();
</script>
</body>
</html>
